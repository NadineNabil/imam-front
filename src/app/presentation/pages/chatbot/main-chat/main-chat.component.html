  <div>
  <div id="main"   [ngClass]="{'loadingMain':status=='loading'||status=='error'}">

    <div *ngIf="!isAgree && showMainPage && !loading"  class="firstwindow" id="firstwindow">

      <div style="text-align: center; margin: 1rem 0;">
        <img class="helloImg" src="../assets/images/robotchat.png">
      </div>

      <div class="content1 text-dark">
        <div>
          {{ "chat.firstwindow_text" | translate }}
        </div>

        <ul>
          <li>{{ "chat.li1" | translate }}</li>
          <li>{{ "chat.li2" | translate }}</li>
          <li>{{ "chat.li3" | translate }}</li>
          <li>{{ "chat.li4" | translate }}</li>
        </ul>

        <div class="purple-radio">
          <label>
            <input
              id="agreeRadio"
              type="radio"
              name="terms"
              (change)="onRadioChange()"
              value="agree"
              required
              #agreeRadio
            >
            <span>
              {{ "chat.agree_terms" | translate }}
            </span>
          </label>
        </div>
      </div>

      <div style="display: flex; justify-content: center" class="submitbtnwrapper  ">
        <button
          class="btn btn-primary"
          id="submitBtn"
          (click)="start()"
          disabled
          #submitBtn
        >
          {{ "chat.start_label" | translate }}
        </button>
      </div>

    </div>

    <app-chat [hidden]="!isAgree" #childRef></app-chat>

  </div>
</div>
