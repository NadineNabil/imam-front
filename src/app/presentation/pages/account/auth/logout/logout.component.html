<div class="auth-page">
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-xxl-3 col-lg-4 col-md-5">
                <div class="auth-full-page-content d-flex p-sm-5 p-4">
                    <div class="w-100">
                        <div class="d-flex flex-column h-100">
                            <div class="mb-4 mb-md-5 text-center">
                                                           <a routerLink="/" class="d-block auth-logo">
                                    <img *ngIf="isDarkMode; else lightLogo" src="assets/images/logoLight.svg"
                                        height="50">

                                    <ng-template #lightLogo>
                                        <img src="assets/images/Moga_Edu.svg" height="50">
                                    </ng-template>
                                </a>
                            </div>
                            <div class="auth-content my-auto">
                                <div class="text-center">
                                    <div class="avatar-xl mx-auto">
                                        <div class="avatar-title bg-light-subtle text-primary h1 rounded-circle">
                                            <i class="bx bxs-user"></i>
                                        </div>
                                    </div>

                                    <div class="mt-4 pt-2">
                                        <h5>{{ 'LOGOUT.TITLE' | translate }}</h5>
                                        <p class="text-muted font-size-15">{{ 'LOGOUT.DESC' | translate }} <span class="fw-semibold text-body">Moga Edu</span></p>
                                        <div class="mt-4">
                                            <a routerLink="/account/login" class="btn btn-primary w-100 waves-effect waves-light">{{ 'LOGOUT.SIGN_IN' | translate }}</a>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-5 text-center">
                                    <p class="text-muted mb-0">{{ 'LOGOUT.DONT_HAVE_AN_ACCOUNT' | translate }} <a routerLink="/account/register" class="text-primary fw-semibold"> {{ 'LOGOUT.SIGNUP' | translate }}</a> </p>
                                </div>
                            </div>
                      
                        </div>
                    </div>
                </div>
                <!-- end auth full page content -->
            </div>
            <!-- end col -->
            <div class="col-xxl-9 col-lg-8 col-md-7">
                <div class="auth-bg auth-bg-regional pt-md-5 p-4 d-flex"
                     [style.backgroundImage]="'url(' + regionBgImage + ')'"
                     [class.image-loaded]="regionImageLoaded"
                     role="img"
                     aria-label="Regional landmark background image">
                    <div class="bg-overlay"></div>
                    <ul class="bg-bubbles">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                    <!-- end bubble effect -->
                    <div class="row justify-content-center align-items-center">
                        <div class="col-xl-12">
                            <div class="p-0 p-sm-4 px-xl-0">
                                <div id="reviewcarouselIndicators" class="carousel slide" data-bs-ride="carousel">
                                    <div class="carousel-inner">
                                        <ngb-carousel [showNavigationArrows]="showNavigationArrows">
                                            <ng-template ngbSlide>
                                                <div class="carousel-item active">
                                                    <div class="testi-contain text-white">
<!--                                                         <i class="bx bxs-quote-alt-left text-success display-6"></i>
 -->
                                                        <h4 class="mt-4 fw-medium lh-base text-white">{{ 'LOGOUT.WELCOME_MESSAGE' | translate }}</h4>
<!--                                                         <div class="mt-4 pt-3 pb-5">
                                                            <div class="d-flex align-items-start">
                                                                <div class="flex-shrink-0">
                                                                    <img src="assets/images/users/avatar-1.jpg" class="avatar-md img-fluid rounded-circle" alt="...">
                                                                </div>
                                                                <div class="flex-grow-1 ms-3 mb-4">
                                                                    <h5 class="font-size-18 text-white">{{ 'LOGOUT.ADMIN' | translate }}</h5>
                                                                    <p class="mb-0 text-white-50">{{ 'LOGOUT.PLATFORM_ADMINISTRATOR' | translate }}</p>
                                                                </div>
                                                            </div>
                                                        </div> -->
                                                    </div>
                                                </div>
                                            </ng-template>
                                        </ngb-carousel>
                                    </div>
                                    <!-- end carousel-inner -->
                                </div>
                                <!-- end review carousel -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end col -->
        </div>
        <!-- end row -->
    </div>
    <!-- end container fluid -->
</div>
