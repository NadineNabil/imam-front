<div [formGroup]="parentForm">
    <h5 class="mb-3">{{'EXAMS.RESPONSE_TYPES' | translate}} <span class="text-danger">*</span></h5>
    <div formArrayName="responseTypesArray" class="checkboxes-container-questions">
        <div *ngFor="let responseTypeGroup of responseTypesFormArray.controls; let i = index" [formGroupName]="i"
            class="mb-3">
            <div>
                <div class="custom-checkbox-resp">
                    <div class="checkbox-label-container">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" [id]="'responsetype'+ i"
                                formControlName="selected">

                            <label class="form-check-label" [for]="'responsetype' + i">{{
                                'ENUM'+'.RESPONSE_TYPES.'+responseTypeGroup.get('responseType')?.value |translate}}</label>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
