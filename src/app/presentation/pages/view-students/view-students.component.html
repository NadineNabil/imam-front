<div class="card">
  <div class="card-body">
    <h4 class="card-title">Students</h4>

    <div class="row mb-3">
      <div class="col-md-4">
        <input class="form-control" placeholder="Search by name or email" [(ngModel)]="query" (ngModelChange)="onSearchChange()" />
      </div>
      <div class="col-md-3">
        <select class="form-control" [(ngModel)]="statusFilter" (change)="applyFilters()">
          <option value="All">All</option>
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Revoked">Revoked</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-light" (click)="clearSearch()">Clear</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Email</th>
            <th>Name</th>
            <th>Status</th>
            <th>Enrollments</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of filtered">
            <td>{{u.email}}</td>
            <td>{{u.fullName}}</td>
            <td>{{u.status}}</td>
            <td>{{u.enrollmentCount}}</td>
            <td class="text-right"><button class="btn btn-sm btn-primary" (click)="goToProfile(u)">View</button></td>
          </tr>
          <tr *ngIf="filtered.length === 0">
            <td colspan="5" class="text-center">No students found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
