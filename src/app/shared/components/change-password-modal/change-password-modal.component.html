<div class="modal-header">
  <h5 class="modal-title">
    {{ 'PROFILE.CHANGE_PASSWORD' | translate }}
  </h5>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="cancel()">
  </button>
</div>

<div class="modal-body">

  <form [formGroup]="passwordForm">

    <!-- Current Password -->
    <div class="mb-3">

      <label class="form-label">
        {{ 'PROFILE.CURRENT_PASSWORD' | translate }}
        <span class="text-danger">*</span>
      </label>

      <div class="position-relative">

        <input
          [type]="showCurrentPassword ? 'text' : 'password'"
          class="form-control pe-5"
          formControlName="currentPassword">

        <button
          type="button"
          class="btn btn-light position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent"
          (click)="showCurrentPassword = !showCurrentPassword">

          <i
            class="mdi fs-5"
            [ngClass]="showCurrentPassword ? 'mdi-eye-outline' : 'mdi-eye-off-outline'">
          </i>

        </button>

      </div>

      <div
        class="text-danger mt-1"
        *ngIf="
          passwordForm.get('currentPassword')?.invalid &&
          passwordForm.get('currentPassword')?.touched
        ">

        <small *ngIf="passwordForm.get('currentPassword')?.errors?.['required']">
          {{ 'PROFILE.CURRENT_PASSWORD_REQUIRED' | translate }}
        </small>

      </div>

    </div>

    <!-- New Password -->
    <div class="mb-3">

      <label class="form-label">
        {{ 'PROFILE.NEW_PASSWORD' | translate }}
        <span class="text-danger">*</span>
      </label>

      <div class="position-relative">

        <input
          [type]="showNewPassword ? 'text' : 'password'"
          class="form-control pe-5"
          formControlName="newPassword">

        <button
          type="button"
          class="btn btn-light position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent"
          (click)="showNewPassword = !showNewPassword">

          <i
            class="mdi fs-5"
            [ngClass]="showNewPassword ? 'mdi-eye-outline' : 'mdi-eye-off-outline'">
          </i>

        </button>

      </div>

      <div
        class="text-danger mt-1"
        *ngIf="
          passwordForm.get('newPassword')?.invalid &&
          passwordForm.get('newPassword')?.touched
        ">

        <small *ngIf="passwordForm.get('newPassword')?.errors?.['required']">
          {{ 'PROFILE.NEW_PASSWORD_REQUIRED' | translate }}
        </small>

        <small *ngIf="passwordForm.get('newPassword')?.errors?.['pattern']">
          {{ 'PROFILE.PASSWORD_PATTERN' | translate }}
        </small>

      </div>

    </div>

    <!-- Confirm Password -->
    <div class="mb-3">

      <label class="form-label">
        {{ 'PROFILE.CONFIRM_PASSWORD' | translate }}
        <span class="text-danger">*</span>
      </label>

      <div class="position-relative">

        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          class="form-control pe-5"
          formControlName="confirmPassword">

        <button
          type="button"
          class="btn btn-light position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent"
          (click)="showConfirmPassword = !showConfirmPassword">

          <i
            class="mdi fs-5"
            [ngClass]="showConfirmPassword ? 'mdi-eye-outline' : 'mdi-eye-off-outline'">
          </i>

        </button>

      </div>

      <div
        class="text-danger mt-1"
        *ngIf="passwordForm.get('confirmPassword')?.touched">

        <small *ngIf="passwordForm.get('confirmPassword')?.errors?.['required']">
          {{ 'PROFILE.CONFIRM_PASSWORD_REQUIRED' | translate }}
        </small>

        <small *ngIf="passwordForm.errors?.['mismatch']">
          {{ 'PROFILE.PASSWORDS_DO_NOT_MATCH' | translate }}
        </small>

      </div>

    </div>

  </form>

</div>

<div class="modal-footer">

  <button
    type="button"
    class="btn btn-primary"
    [disabled]="passwordForm.invalid"
    (click)="changePassword()">

    {{ 'PROFILE.SAVE' | translate }}

  </button>

 <!--  <button
    type="button"
    class="btn btn-light"
    (click)="cancel()">

    {{ 'PROFILE.CANCEL' | translate }}

  </button> -->

</div>
